<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0f766e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<title>BharatLedger</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--p:#0f766e;--pd:#0d5c56;--pl:#14b8a6;--bg:#f0fdfa;--c:#fff;--t:#134e4a;--b:#99f6e4;--d:#dc2626;--s:#16a34a;--w:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding-bottom:72px;-webkit-tap-highlight-color:transparent}
.hdr{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.hdr h1{font-size:1.2rem}.badge{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:12px;font-size:.7rem}
.ct{padding:16px;max-width:600px;margin:0 auto}
.card{background:var(--c);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--b);box-shadow:0 4px 6px rgba(0,0,0,.08)}
.card h2{font-size:1.05rem;margin-bottom:12px;color:var(--pd)}
.fg{margin-bottom:12px}.fg label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:8px;font-size:1rem;background:#fff;-webkit-appearance:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;width:100%}
.bp{background:var(--p);color:#fff}.bs{background:#fff;color:var(--p);border:1px solid var(--p)}.bd{background:var(--d);color:#fff}
.bw{background:#25D366;color:#fff}.bsm{padding:8px 12px;font-size:.85rem;width:auto}
.br{display:flex;gap:8px;margin-top:12px}.br .btn{flex:1}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--b);gap:8px}
.li:last-child{border-bottom:none}.li .inf{flex:1;min-width:0}.li .ti{font-weight:600;font-size:.95rem}.li .su{font-size:.8rem;color:#64748b}
.li .am{font-weight:700;white-space:nowrap}.li .ac{display:flex;gap:6px;flex-shrink:0}
.pos{color:var(--s)}.neg{color:var(--d)}
.em{text-align:center;padding:32px 16px;color:#94a3b8}.em .ic{font-size:2.5rem;margin-bottom:8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sc{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;border-radius:12px;padding:14px;text-align:center}
.sc .lb{font-size:.75rem;opacity:.9}.sc .vl{font-size:1.2rem;font-weight:700;margin-top:4px}
.sc.a{background:linear-gradient(135deg,#1e40af,#3b82f6)}.sc.w{background:linear-gradient(135deg,#b45309,#f59e0b)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:8px;font-size:.9rem;z-index:300;max-width:90%;text-align:center}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
.co{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}
.cb{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.cb .ic{font-size:2.5rem;margin-bottom:12px}.cb h3{font-size:1.1rem;margin-bottom:8px;color:var(--pd)}
.cb p{font-size:.9rem;color:#64748b;margin-bottom:16px;line-height:1.4}
.cb .dt{background:#f0fdfa;border-radius:8px;padding:12px;margin-bottom:16px;text-align:left;font-size:.85rem}
.cb .dt div{margin-bottom:4px;word-break:break-all}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600;background:#e0f2fe;color:#0369a1}
.chip.pending{background:#fef3c7;color:#b45309}.chip.available{background:#dcfce7;color:#15803d}
.chip.activated{background:#dbeafe;color:#1d4ed8}.chip.revoked{background:#fee2e2;color:#b91c1c}
.chip.asset{background:#dcfce7;color:#15803d}.chip.liability{background:#fee2e2;color:#b91c1c}
.chip.income{background:#dbeafe;color:#1d4ed8}.chip.expense{background:#fef3c7;color:#b45309}
.bn{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:6px 0;z-index:100}
.bn button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.58rem;color:#64748b;cursor:pointer;padding:4px 5px;min-width:42px}
.bn button.active{color:var(--p);font-weight:600}.bn .ic{font-size:1.15rem}
.rr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--b);font-size:.9rem}
.rr.tot{font-weight:700;border-bottom:2px solid var(--p);margin-top:8px;padding-top:12px}
.st{font-size:.85rem;font-weight:700;color:var(--pd);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.lb{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:16px;text-align:center}
.lb.lk{background:linear-gradient(135deg,#dc2626,#f87171)}
.qb{background:var(--p);color:#fff;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600}
.ti{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.ti button{padding:8px 14px;border-radius:20px;border:1px solid var(--b);background:#fff;font-size:.8rem;white-space:nowrap;cursor:pointer}
.ti button.active{background:var(--p);color:#fff;border-color:var(--p)}
.rb{background:#f0fdfa;border:1px solid var(--b);border-radius:10px;padding:14px;margin:12px 0}
.rw{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px dotted #ccfbf1;gap:8px}
.rw:last-child{border-bottom:none}
.si{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.sd{width:28px;height:28px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.sd.active{background:var(--p);color:#fff}.sd.done{background:var(--s);color:#fff}
.sl{flex:1;height:2px;background:#e2e8f0}.sl.done{background:var(--s)}
.gs{margin-bottom:20px}.gs h3{font-size:1rem;color:var(--p);margin-bottom:8px}
.gs p,.gs li{font-size:.9rem;line-height:1.5;color:#334155}.gs ul{padding-left:20px;margin-top:6px}
.gt{background:#fef3c7;border-left:4px solid var(--w);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.85rem;margin:10px 0}
.ib{background:none;border:1px solid var(--b);border-radius:6px;padding:4px 8px;font-size:.8rem;cursor:pointer;color:var(--p)}
.ib.dg{color:var(--d);border-color:#fecaca}
.kd{font-family:ui-monospace,monospace;background:#f1f5f9;padding:10px 12px;border-radius:8px;font-size:.9rem;word-break:break-all;margin:8px 0}
.mono{font-family:ui-monospace,monospace;font-size:.85rem}
@media(min-width:600px){.ct{padding:24px}.md{border-radius:16px;margin-bottom:20px}.mo{align-items:center}}

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const {useState,useEffect,useMemo}=React;
const DB='bharatledger_db_v3';
const PL={PRO:'Professional / Doctor',SAL:'Salaried Individual',SMB:'Small Business / Kirana'};
const DAG=[
{id:'ag1',name:'Current Assets',nature:'Asset',parent:null},{id:'ag2',name:'Cash-in-Hand',nature:'Asset',parent:'ag1'},
{id:'ag3',name:'Bank Accounts',nature:'Asset',parent:'ag1'},{id:'ag4',name:'Sundry Debtors',nature:'Asset',parent:'ag1'},
{id:'ag5',name:'Stock-in-Hand',nature:'Asset',parent:'ag1'},{id:'ag6',name:'Fixed Assets',nature:'Asset',parent:null},
{id:'ag7',name:'Current Liabilities',nature:'Liability',parent:null},{id:'ag8',name:'Sundry Creditors',nature:'Liability',parent:'ag7'},
{id:'ag9',name:'Loans (Liability)',nature:'Liability',parent:null},{id:'ag10',name:'Capital Account',nature:'Equity',parent:null},
{id:'ag11',name:'Direct Incomes',nature:'Income',parent:null},{id:'ag12',name:'Sales Accounts',nature:'Income',parent:'ag11'},
{id:'ag13',name:'Indirect Incomes',nature:'Income',parent:null},{id:'ag14',name:'Direct Expenses',nature:'Expense',parent:null},
{id:'ag15',name:'Purchase Accounts',nature:'Expense',parent:'ag14'},{id:'ag16',name:'Indirect Expenses',nature:'Expense',parent:null}];
const DL=[{id:'l1',name:'Cash',groupId:'ag2',openingBalance:0,isSystem:true},{id:'l2',name:'Bank Account',groupId:'ag3',openingBalance:0,isSystem:true},
{id:'l3',name:'Sales',groupId:'ag12',openingBalance:0,isSystem:true},{id:'l4',name:'Purchases',groupId:'ag15',openingBalance:0,isSystem:true},
{id:'l5',name:'Capital',groupId:'ag10',openingBalance:0,isSystem:true}];
function loadDB(){try{const r=localStorage.getItem(DB);if(r)return JSON.parse(r);
const o=localStorage.getItem('bharatledger_db_v2')||localStorage.getItem('bharatledger_db_v1');
if(o){const d=JSON.parse(o);d.licencePool=d.licencePool||[];d.ownerPinHash=d.ownerPinHash||null;localStorage.setItem(DB,JSON.stringify(d));return d;}}catch(e){}
return{license:null,company:null,accountGroups:DAG,ledgers:DL,vouchers:[],inventory:[],voucherItems:[],auditLocked:false,settings:{financialYear:'2025-26'},licencePool:[],ownerPinHash:null};}
const save=d=>localStorage.setItem(DB,JSON.stringify(d));
const INR=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return'h'+Math.abs(h).toString(36);};
function genKey(plan){const pc=(plan||'SMB').toUpperCase(),ts=Date.now().toString(36).toUpperCase(),C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let r='';for(let i=0;i<6;i++)r+=C[Math.floor(Math.random()*32)];const b=`BL-${pc}-${ts}-${r}`;let s=0;for(let i=0;i<b.length;i++)s+=b.charCodeAt(i);return b+'-'+C[s%32];}

function Confirm({open,title,message,details,confirmLabel,danger,onConfirm,onCancel}){
if(!open)return null;
return(<div className="co" onClick={onCancel}><div className="cb" onClick={e=>e.stopPropagation()}>
<div className="ic">{danger?'⚠️':'✅'}</div><h3>{title}</h3><p>{message}</p>
{details&&<div className="dt">{Object.entries(details).map(([k,v])=><div key={k}><strong>{k}:</strong> {String(v)}</div>)}</div>}
<div className="br"><button className="btn bs" onClick={onCancel}>Cancel</button>
<button className={'btn '+(danger?'bd':'bp')} onClick={onConfirm}>{confirmLabel||'Confirm'}</button></div></div></div>);
}

function App(){
const[db,setDb]=useState(loadDB),[tab,setTab]=useState('dashboard'),[toast,setToast]=useState(null);
const[modal,setModal]=useState(null),[confirm,setConfirm]=useState(null),[adminOk,setAdminOk]=useState(false);
useEffect(()=>{save(db);},[db]);
const tip=(m,ms=2800)=>{setToast(m);setTimeout(()=>setToast(null),ms);};
const upd=u=>setDb(p=>typeof u==='function'?u(p):{...p,...u});
const ask=o=>new Promise(r=>setConfirm({...o,onConfirm:()=>{setConfirm(null);r(true);},onCancel:()=>{setConfirm(null);r(false);}}));

const setPin=async pin=>{if(!pin||pin.length<4){tip('PIN min 4');return;}
if(!await ask({title:'Set Master Owner PIN?',message:'Protects key generation. Backup this device.',details:{Length:pin.length+' chars'},confirmLabel:'Set PIN'}))return;
upd({ownerPinHash:hash(pin)});setAdminOk(true);tip('PIN set');};
const unlock=pin=>{if(hash(pin)!==db.ownerPinHash){tip('Wrong PIN');return;}setAdminOk(true);tip('Unlocked');};
const genKeys=async(plan,count,years)=>{if(!adminOk){tip('Unlock admin');return;}
count=Math.min(Math.max(1,+count||1),50);years=+years||1;
if(!await ask({title:'Generate keys?',message:'Unique offline keys.',details:{Plan:PL[plan],Count:count,Years:years},confirmLabel:'Generate'}))return;
const ex=new Set((db.licencePool||[]).map(k=>k.key)),created=[];
for(let i=0;i<count;i++){let k;do{k=genKey(plan);}while(ex.has(k));ex.add(k);
const exp=new Date();exp.setFullYear(exp.getFullYear()+years);
created.push({key:k,plan,status:'available',mobile:null,expiry:exp.toISOString().slice(0,10),createdAt:new Date().toISOString(),activatedAt:null,revokedAt:null});}
upd(p=>({...p,licencePool:[...(p.licencePool||[]),...created]}));tip(created.length+' key(s)');setModal({type:'keysGen',data:created});};
const revokeKey=async e=>{if(!adminOk)return;
if(!await ask({title:'Revoke?',message:'Customer cannot activate.',details:{Key:e.key},confirmLabel:'Revoke',danger:true}))return;
upd(p=>({...p,licencePool:(p.licencePool||[]).map(k=>k.key===e.key?{...k,status:'revoked',revokedAt:new Date().toISOString()}:k),
license:p.license&&p.license.key===e.key?{...p.license,active:false}:p.license}));tip('Revoked');};
const exportKeys=async()=>{if(!adminOk)return;if(!await ask({title:'Export pool?',message:'Secure this file.',confirmLabel:'Export'}))return;
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),licencePool:db.licencePool||[]},null,2)],{type:'application/json'}));
a.download='bharatledger_licences_'+today()+'.json';a.click();tip('Exported');};
const importKeys=async file=>{if(!adminOk)return;if(!await ask({title:'Import?',message:'Merges keys.',confirmLabel:'Import',danger:true}))return;
const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);const inc=data.licencePool||data;if(!Array.isArray(inc)){tip('Invalid');return;}
upd(p=>{const m=new Map((p.licencePool||[]).map(k=>[k.key,k]));inc.forEach(k=>{if(k?.key)m.set(k.key,{...m.get(k.key),...k});});return{...p,licencePool:[...m.values()]};});tip('Imported');}catch{tip('Fail');}};r.readAsText(file);};

const activateLicense=async(key,mobile)=>{
key=(key||'').trim().toUpperCase();mobile=(mobile||'').trim();
if(!key.startsWith('BL-')){tip('Must start BL-');return;}
if(mobile.replace(/\D/g,'').length<10){tip('10-digit mobile');return;}
let entry=(db.licencePool||[]).find(k=>k.key===key);
if(!entry&&!(db.licencePool||[]).length&&(key.includes('DEMO')||/^BL-(PRO|SAL|SMB)-/.test(key))){
let plan='SMB';if(key.includes('PRO'))plan='PRO';else if(key.includes('SAL'))plan='SAL';
const exp=new Date();exp.setFullYear(exp.getFullYear()+1);
entry={key,plan,status:'available',expiry:exp.toISOString().slice(0,10),createdAt:new Date().toISOString(),_ephemeral:true};}
if(!entry){tip('Key not found — ask owner');return;}
if(entry.status==='revoked'){tip('Revoked');return;}
if(entry.status==='activated'&&entry.mobile&&entry.mobile!==mobile){tip('Bound to another mobile');return;}
if(entry.expiry&&entry.expiry<today()){tip('Expired');return;}
const planLabel=PL[entry.plan]||entry.plan;
if(!await ask({title:'Activate?',message:'Offline automatic validation.',details:{Key:key,Mobile:mobile,Plan:planLabel,Until:entry.expiry},confirmLabel:'Activate'}))return;
const license={key,mobile,plan:planLabel,planCode:entry.plan,expiry:entry.expiry,active:true,activatedAt:new Date().toISOString()};
upd(p=>{let pool=[...(p.licencePool||[])];
if(entry._ephemeral)pool.push({key,plan:entry.plan,status:'activated',mobile,expiry:entry.expiry,createdAt:entry.createdAt,activatedAt:license.activatedAt,revokedAt:null});
else pool=pool.map(k=>k.key===key?{...k,status:'activated',mobile,activatedAt:license.activatedAt}:k);
return{...p,license,licencePool:pool};});tip('Activated: '+planLabel);setModal(null);};

const saveCompany=async(data,isEdit)=>{if(!data.name||!data.owner){tip('Required fields');return;}
if(!await ask({title:isEdit?'Update?':'Create Profile?',message:'Review.',details:{Company:data.name,Owner:data.owner,Phone:data.phone||'—',GSTIN:data.gstin||'—'},confirmLabel:isEdit?'Update':'Create'}))return;
upd({company:{...data,id:data.id||uid(),updatedAt:new Date().toISOString()}});tip('Saved');setModal(null);};
const saveLedger=async(data,isEdit)=>{if(!data.name){tip('Name');return;}
const g=db.accountGroups.find(x=>x.id===data.groupId);
if(!await ask({title:isEdit?'Update Ledger?':'Create?',message:'Review.',details:{Name:data.name,Group:g?.name,OB:INR(data.openingBalance)},confirmLabel:'Save'}))return;
if(isEdit)upd(p=>({...p,ledgers:p.ledgers.map(l=>l.id===data.id?{...l,...data}:l)}));
else upd(p=>({...p,ledgers:[...p.ledgers,{id:uid(),...data,isSystem:false}]}));tip('Saved');setModal(null);};
const delLedger=async l=>{if(l.isSystem){tip('Protected');return;}if(!await ask({title:'Delete?',message:l.name,confirmLabel:'Delete',danger:true}))return;
upd(p=>({...p,ledgers:p.ledgers.filter(x=>x.id!==l.id)}));tip('Deleted');};
const saveItem=async(data,isEdit)=>{if(!data.name){tip('Name');return;}
if(!await ask({title:isEdit?'Update Item?':'Add?',message:'Review.',details:{Name:data.name,Rate:INR(data.unitRate),Qty:data.quantity},confirmLabel:'Save'}))return;
if(isEdit)upd(p=>({...p,inventory:p.inventory.map(it=>it.id===data.id?{...it,name:data.name,hsn:data.hsn||'',unitRate:+data.unitRate||0,gstRate:+data.gstRate||0,quantity:+data.quantity||0,unit:data.unit||'Nos'}:it)}));
else upd(p=>({...p,inventory:[...p.inventory,{id:uid(),name:data.name,hsn:data.hsn||'',unitRate:+data.unitRate||0,gstRate:+data.gstRate||0,quantity:+data.quantity||0,unit:data.unit||'Nos'}]}));
tip('Saved');setModal(null);};
const delItem=async it=>{if(!await ask({title:'Delete item?',message:it.name,confirmLabel:'Delete',danger:true}))return;
upd(p=>({...p,inventory:p.inventory.filter(x=>x.id!==it.id)}));tip('Deleted');};
const createVoucher=async data=>{if(db.auditLocked){tip('Locked');return;}if((+data.amount||0)<=0){tip('Amount');return;}
if(!await ask({title:'Confirm '+data.type+'?',message:'Updates stock & ledgers.',details:{Type:data.type,Date:data.date,Party:data.partyName||'—',Amount:INR(data.amount)},confirmLabel:'Save'}))return;
const v={id:uid(),type:data.type,date:data.date||today(),amount:+data.amount||0,fromLedgerId:data.fromLedgerId,toLedgerId:data.toLedgerId,narration:data.narration||'',partyName:data.partyName||'',syncStatus:'pending',items:data.items||[],createdAt:new Date().toISOString()};
upd(p=>{let inv=[...p.inventory];
if(v.type==='Sales'||v.type==='Receipt')v.items.forEach(vi=>{inv=inv.map(it=>it.id===vi.itemId?{...it,quantity:Math.max(0,(it.quantity||0)-(vi.qty||0))}:it);});
else if(v.type==='Purchase'||v.type==='Payment')v.items.forEach(vi=>{inv=inv.map(it=>it.id===vi.itemId?{...it,quantity:(it.quantity||0)+(vi.qty||0)}:it);});
return{...p,vouchers:[v,...p.vouchers],inventory:inv};});tip('Saved');setModal(null);};
const updateVoucher=async data=>{if(db.auditLocked){tip('Locked');return;}
if(!await ask({title:'Update?',message:'Party/date/narration.',details:{Amount:INR(data.amount)},confirmLabel:'Update'}))return;
upd(p=>({...p,vouchers:p.vouchers.map(v=>v.id===data.id?{...v,partyName:data.partyName,narration:data.narration,date:data.date}:v)}));tip('Updated');setModal(null);};
const delVoucher=async v=>{if(db.auditLocked){tip('Locked');return;}
if(!await ask({title:'Delete?',message:'Stock reversed.',details:{Type:v.type,Amount:INR(v.amount)},confirmLabel:'Delete',danger:true}))return;
upd(p=>{let inv=[...p.inventory];
if(v.type==='Sales'||v.type==='Receipt')(v.items||[]).forEach(vi=>{inv=inv.map(it=>it.id===vi.itemId?{...it,quantity:(it.quantity||0)+(vi.qty||0)}:it);});
else if(v.type==='Purchase'||v.type==='Payment')(v.items||[]).forEach(vi=>{inv=inv.map(it=>it.id===vi.itemId?{...it,quantity:Math.max(0,(it.quantity||0)-(vi.qty||0))}:it);});
return{...p,vouchers:p.vouchers.filter(x=>x.id!==v.id),inventory:inv};});tip('Deleted');};

const buildInv=v=>{const co=db.company,L=[];
L.push('*'+(co?.name||'BharatLedger')+' — Invoice*');if(co?.phone)L.push('Phone: '+co.phone);if(co?.gstin)L.push('GSTIN: '+co.gstin);
L.push('---');L.push('Type: '+v.type);L.push('Date: '+v.date);if(v.partyName)L.push('Party: '+v.partyName);L.push('');
(v.items||[]).forEach(vi=>{const it=db.inventory.find(x=>x.id===vi.itemId);const b=(vi.qty||0)*(vi.rate||0);L.push('• '+(it?.name||'Item')+' x '+vi.qty+' @ '+INR(vi.rate)+' = '+INR(b));});

<button className="btn bw" onClick={()=>shareWA(modal.data)}>💬 WhatsApp Invoice</button>
<div className="br"><button className="btn bs" onClick={()=>setModal(null)}>Close</button>
{!db.auditLocked&&<button className="btn bp" onClick={()=>setModal({type:'vEdit',data:modal.data})}>Edit</button>}</div>
</div></div>)}

{mt==='vEdit'&&modal.data&&(()=>{const v=modal.data;const[date,setDate]=useState(v.date),[party,setParty]=useState(v.partyName||''),[nar,setNar]=useState(v.narration||'');
return(<div className="mo" onClick={()=>setModal(null)}><div className="md" onClick={e=>e.stopPropagation()}>
<h2>Edit</h2>
<div className="fg"><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
<div className="fg"><label>Party</label><input value={party} onChange={e=>setParty(e.target.value)}/></div>
<div className="fg"><label>Narration</label><textarea value={nar} onChange={e=>setNar(e.target.value)}/></div>
<div className="br"><button className="btn bs" onClick={()=>setModal(null)}>Cancel</button>
<button className="btn bp" onClick={()=>updateVoucher({...v,date,partyName:party,narration:nar})}>Update</button></div>
</div></div>);})()}
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
